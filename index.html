<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PuG Vetter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout">

  <section class="main">
    <header>
      <h1>PuG Vetter</h1>
      <p class="sub">Warcraft Logs lookup &mdash; clears, parses, enchants &amp; gems &nbsp;·&nbsp; <b id="realm-label">…</b></p>
    </header>

    <form id="vet-form" autocomplete="off">
      <input id="name" name="name" placeholder="Character name" required autofocus />
      <button type="submit">Vet</button>
      <button type="button" id="regulars-btn" class="secondary" hidden
              title="Players who have raided with you the most">My regulars</button>
    </form>

    <div id="status" class="status"></div>
    <main id="feed"></main>

    <footer>
      Data: <a href="https://classic.warcraftlogs.com" target="_blank" rel="noopener">Warcraft Logs</a>.
      Only logged characters appear &mdash; "no data" is not proof someone hasn't raided.
    </footer>
  </section>

  <aside class="roster" id="roster-panel">
    <div class="roster-head">
      <h2>Roster</h2>
      <span id="roster-summary" class="roster-summary"></span>
      <button id="roster-clear" type="button" title="Empty the whole roster">Clear</button>
    </div>
    <p class="roster-hint">Vet a player, hit <b>＋ Add to roster</b>, then drag the card into a group.</p>

    <div class="dropzone bench" data-zone="bench">
      <h3>Bench <span class="zcount"></span></h3>
      <div class="zone-cards"></div>
    </div>

    <div class="groups" id="groups"></div>
  </aside>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
